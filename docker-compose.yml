
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hackbuddy
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: hackbuddydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackbuddy -d hackbuddydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://hackbuddy:password123@postgres:5432/hackbuddydb
      SECRET_KEY: myverysecretkey123
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
